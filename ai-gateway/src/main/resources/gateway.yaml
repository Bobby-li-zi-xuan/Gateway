# 网关配置（V4 完整结构，对照《版本4-详细实施计划》第 5.1 节）
#
# V1 结构（health / channels / models）保留；V2 新增 decision / policies / plugins；
# V3 新增：
# - gateway.execution：容错治理参数（重试 / 分层超时 / 熔断 / 冷却，全部有缺省）
# - channels[].timeout：渠道级超时覆盖（可选，不配则用 execution.defaultTimeout）
# V4 新增：
# - gateway.governance：治理参数（鉴权 / 限流 / 配额 / 计量 / 批量落库，全部有缺省）
# - gateway.tokens：启动种子令牌（演示用，可空；无令牌时自动创建演示令牌）
# - plugins 追加 governance-bootstrap（BEFORE_DECISION 写治理信号，order=100 最先执行）
gateway:
  include:
    - channels.yaml             # 拆分配置
  health:
    intervalSeconds: 5
    timeoutMs: 2000
    consecutiveFailures: 3

  execution:                    # V3 新增：容错治理参数（全部有缺省，旧配置可直接启动）
    totalMs: 60000              # 整条降级链的总时长上限（所有候选/尝试共享）
    defaultTimeout:             # 渠道级缺省分层超时
      connectMs: 500            # 建立 TCP 连接
      requestMs: 30000          # 非流式：发请求到收完整响应
      firstByteMs: 10000        # 流式：发请求到收到首个数据 chunk
      idleMs: 30000             # 流式：相邻 chunk 的最大间隔（空闲超时）
    retry:
      maxAttemptsPerCandidate: 1        # 每个候选默认尝试次数（默认 1 = 不重试同实例）
      sameInstanceOnConnectionFailure: true  # 连接级失败允许同实例重试一次（学习版 4.1）
      respectRetryAfter: true           # 429 时优先遵循上游 Retry-After
      maxRetryAfterMs: 5000             # Retry-After 等待上限，防止被上游拖死
      backoffBaseMs: 100                # 指数退避基数
      backoffMaxMs: 2000                # 退避上限
      jitterRatio: 0.2                  # 随机抖动比例（防惊群）
      retryableStatuses: [429, 500, 502, 503, 504]
    circuitBreaker:
      windowSize: 100            # 环形窗口：统计最近 N 次调用
      minimumRequests: 5         # 样本不足时不触发熔断
      failureRateThreshold: 0.5  # 失败率阈值（0~1）
      slowCallThresholdMs: 10000 # 超过该延迟判定为慢调用
      slowCallRateThreshold: 0.5 # 慢调用率阈值
      openDurationMs: 30000      # 打开状态持续时间
      halfOpenMaxRequests: 1     # 半开态放行的探测请求数
    cooldown:
      consecutiveFailures: 5     # 连续失败多少次进入冷却
      cooldownMs: 30000          # 冷却时长
      maxCooldownMs: 300000      # 恢复探测失败翻倍的上限
      recoveryProbe: true        # 恢复后第一个请求视为探测，失败则时长翻倍
    state:
      flushIntervalMs: 500       # 状态事件管道聚合周期（毫秒）

  decision:
    logSize: 100
    ewmaAlpha: 0.3
    errorRateAlpha: 0.1
    defaultOutputTokens: 256

  governance:                   # ── V4 新增：治理参数（对照详细计划 5.1）──
    enabled: true               # 总开关：false = 跳过鉴权与限流（演示旁路用）
    db:
      url: jdbc:h2:file:./data/gateway    # 文件模式；测试用 jdbc:h2:mem:gateway
      user: sa
      password: ""
    estimation:                 # 近似计量系数（CJK 1 字/token，其他约 4 字符/token）
      charsPerToken: 4.0
      cjkTokenPerChar: 1.0
    rateLimit:                  # 限流（管速度）
      defaultQps: 100           # 令牌级缺省 QPS（滑动窗口 1s）
      defaultRpm: 6000          # 令牌级缺省 RPM（滑动窗口 60s）
      tokenRate:                # Token 速率限流（可选）：预扣预估输入、结束按实际修正
        enabled: false
        perSecondTokens: 20000
    budget:                     # 配额（管总量）
      warnRatios: [ 0.7, 0.9 ]  # 预警阈值（软预算，不阻断）
      exceedAction: REJECT      # 超额动作：REJECT（拒绝）/ DEGRADE（降级到低成本候选）
      defs:                     # 配置定义的预算；热更新更新上限、已用量保留
        - scope: MODEL          # MODEL/CHANNEL/GLOBAL
          scopeValue: qwen-large
          limitType: COST       # TOKEN / COST
          period: DAILY         # HOURLY / DAILY / MONTHLY
          limit: 1.0            #上限
    usageFlush:                 # 用量批量落库
      intervalMs: 5000          # 定时 flush 周期
      batchSize: 100            # 单批最大条数（达到即刷）

  channels:
    - id: mock-a
      provider: openai-compatible
      baseUrl: http://localhost:8001
      credentialsRef: ""          # 空表示无需密钥（mock）；真实上游写 env:OPENAI_API_KEY
      weight: 10
      enabled: true               # 渠道启停开关（热更新即时生效）
      # timeout:                   # V3 可选：渠道级覆盖；不配则用 defaultTimeout
      #   connectMs: 500
      #   requestMs: 30000
      #   firstByteMs: 8000
      #   idleMs: 20000
    - id: mock-b
      provider: openai-compatible
      baseUrl: http://localhost:8002
      credentialsRef: ""
      weight: 5
      # timeout 不配 → 用 execution.defaultTimeout

  models:
    - alias: qwen
      strategy: simple-task        # 引用 gateway.policies 里的模板名
      candidates:
        - channelId: mock-a
          model: qwen-large
          weight: 8
          priceIn: 0.002           # V4 价格修正：qwen-large 贵且好（单次 256 输出约 $0.001）
          priceOut: 0.004          # 每 1K output tokens 价格
          qualityScore: 0.9        # 0~1 静态质量分
          latencyProfileMs: 2000   # EWMA 初始延迟，与实际 mock 延迟一致
          capability:
            contextLength: 128000
            multimodal: false
            toolCallSupport: true
            codingAbility: MEDIUM
            reasoningLevel: HIGH
            qualityLevel: QUALITY_HIGH
        - channelId: mock-b
          model: qwen-small
          weight: 2
          priceIn: 0.0005          # V4 价格修正：qwen-small 便宜且快（单次 256 输出约 $0.00026）
          priceOut: 0.001          # 低成本候选真实存在，成本降级演示（21.4）依赖此配置
          qualityScore: 0.4
          latencyProfileMs: 200
          capability:
            contextLength: 32000
            multimodal: false
            toolCallSupport: false
            codingAbility: LOW
            reasoningLevel: LOW
            qualityLevel: FAST
    - alias: deepseek-code
      strategy: quality-first
      candidates:
        - channelId: mock-b
          model: deepseek-code
          weight: 1
          priceIn: 0.002
          priceOut: 0.004
          qualityScore: 0.8
          latencyProfileMs: 500
          capability:
            contextLength: 64000
            multimodal: false
            toolCallSupport: true
            codingAbility: MAX
            reasoningLevel: MEDIUM
            qualityLevel: QUALITY_MEDIUM

  policies:
    - name: balanced
      type: MULTI_OBJECTIVE
      weights: { latency: 0.25, cost: 0.25, quality: 0.25, health: 0.25 }
    - name: latency-first
      type: MULTI_OBJECTIVE
      weights: { latency: 0.6, cost: 0.1, quality: 0.15, health: 0.15 }
    - name: cost-first
      type: MULTI_OBJECTIVE
      weights: { latency: 0.1, cost: 0.6, quality: 0.2, health: 0.1 }
    - name: quality-first
      type: MULTI_OBJECTIVE
      weights: { latency: 0.15, cost: 0.1, quality: 0.6, health: 0.15 }
    - name: simple-task
      type: CONDITIONAL
      defaultStrategy: balanced   # 规则未命中时回退到该策略（必须是 MULTI_OBJECTIVE）
      rules:
        - when:
            signal: task_complexity
            op: EQ
            value: COMPLEX
          select:                 # 命中选择的候选（必须是该别名候选的子集）
            - channelId: mock-a
              model: qwen-large

  plugins:
    - name: complexity-recognizer
      scope: GLOBAL
      order: 30
      config:
        keywordRegex: "代码|算法|重构|设计"
    - name: canary
      scope: ROUTE
      scopeValue: qwen            # ROUTE 作用域：只对 alias=qwen 生效
      order: 20
      config:
        stableInstances: [ "mock-a:qwen-large" ]
        canaryInstances: [ "mock-b:qwen-small" ]
        # 无 enabled 开关：演示 B 禁用金丝雀 = 注释掉本挂载项（见实施计划 21.4）
    - name: clear-candidates      # 仅演示 fail-closed 用，默认关闭
      scope: GLOBAL
      order: 10
      config:
        enabled: false
    - name: governance-bootstrap  # ── V4 新增：BEFORE_DECISION 写治理信号（必须最先执行）──
      scope: GLOBAL
      order: 100                 # 数字大先执行：信号要赶在过滤器读信号之前
      config: {}
    - name: clear-candidates      # enabled开关
      scope: GLOBAL
      order: 10
      enabled: false             # false = 不挂载

  tokens:                        # ── V4 新增：启动种子令牌（演示用，可空）──
    - name: demo
      quotaLimit: 1.0            # 额度上限（美元，-1 = 无限）；TOKEN 类型则写 token 数
      quotaType: COST
      modelScope: ""             # 空 = 不限；逗号分隔的 alias 列表
      ipWhitelist: ""            # 空 = 不限；逗号分隔的 IP 列表
      expiresAt: -1              # epoch 毫秒；-1 = 永不过期
      enabled: true
  
  admin:
    name: admin                  # 审计李的操作者名称
    apiKey: env:ADMIN_KEY        # 管理密钥：env：引用或者明文；未配置：自动生成随机密钥并打印日志
    ipWhitelist: []              # 空= 不限： 否则都好分割的IP列表（精确匹配，不支持CIDR）