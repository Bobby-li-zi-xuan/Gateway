server:
  port: 8080

spring:
  config:

  threads:
    virtual:
      enabled: true

logging:
  level:
    com.aigateway: DEBUG
  pattern: "[Gateway %d{HH:mm:ss}] %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

gateway:
  config:                 # 加载器参数（不属于配置快照）
    path: classpath:gateway.yaml
    historySize: 5        # 配置历史版本保留数（回滚范围）
