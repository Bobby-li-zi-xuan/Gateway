# 集成测试专用模型配置：渠道指向测试 mock 的固定端口 18001/18002。
# 健康检查参数压缩为 1 秒/1 次，加快剔除验证，避免测试等 15 秒。
gateway:
  health:
    intervalSeconds: 1
    timeoutMs: 2000
    consecutiveFailures: 1
  channels:
    - id: mock-a
      provider: openai-compatible
      baseUrl: http://localhost:18001
      credentialsRef: ""
      weight: 10
    - id: mock-b
      provider: openai-compatible
      baseUrl: http://localhost:18002
      credentialsRef: ""
      weight: 5
  models:
    - alias: qwen
      candidates:
        - channelId: mock-a
          model: qwen-large
          weight: 8
        - channelId: mock-b
          model: qwen-small
          weight: 2
    - alias: deepseek-code
      candidates:
        - channelId: mock-b
          model: deepseek-code
          weight: 1
